# Roles for the apod broker: what a pod may do without asking, on what's in its scope; anything
# else waits for your approval. A pod's role is its profile's broker.toml role, or --role, else
# reader. Add roles in ~/.agent-pod/roles.toml; a role there with a name used here adds its lists
# to this one. Approvals "for the role" are saved in ~/.agent-pod/broker/grants.json.
#
# One list per provider; entries are shell-style patterns (* matches anything, including /):
#   gh      gh commands ("pr create", "project item-edit"; risky flags add "<command> --<flag>",
#           e.g. "pr merge --admin"); REST as "api METHOD PATH" with the repository as {repo}
#           ("api GET /repos/{repo}/pulls/*") and orgs/users as {owner}; GraphQL as
#           "graphql query FIELD" or "graphql mutation NAME" (top-level fields; repository,
#           organization/user and node ids are checked against the scope)
#   github  git over https to github.com: "fetch", "fetch public" (public repositories outside
#           the scope), "push branch", "push default-branch", "push tag", "push delete", "push force"
#           (a branch update that isn't a fast-forward: --force and --force-with-lease alike),
#           "push other-ref" (any other ref, e.g. refs/notes/*)
#   rad     git to rad:// remotes: "fetch", "push branch", "push default-branch", "push patch"
#           (HEAD:refs/patches), "push tag", "push delete", "push force" (not a fast-forward),
#           "push other-ref"
#   git-sign "commit", "tag", "as other" (a commit or tag by anyone but the profile's git identity)
#   ssh     "connect" (through the broker, ProxyCommand; "connect port" for a port other than ssh's),
#           "login" (the agent signs a login);
#           which hosts is the scope's business (broker.toml [ssh] hosts, --scope ssh:HOST). Only
#           ops logs in: a login is a shell on the host, beyond what the broker can check.

[roles.reader]
description = "Read code, PRs, issues and CI; fetch"
gh = [
  "pr list", "pr view", "pr diff", "pr checks", "pr status",
  "issue list", "issue view", "issue status",
  "run list", "run view", "run watch", "workflow list", "workflow view",
  "repo view", "label list", "release list", "release view", "cache list", "ruleset list", "ruleset view",
  "search issues", "search prs", "search code", "search commits", "search repos",
  "repo gitignore *", "repo license *",
  "api GET /repos/{repo}", "api GET /repos/{repo}/*", "api GET /rate_limit",
  "graphql query repository", "graphql query rateLimit", "graphql query node", "graphql query nodes",
]
github = ["fetch", "fetch public"]
rad = ["fetch"]

[roles.dev]
description = "reader + push branches (force pushes too), open patches, create and edit PRs, create and comment on issues, sign commits"
extends = ["reader"]
gh = [
  "pr create", "pr edit", "pr comment", "pr ready",
  "issue create", "issue comment",
  "api POST /repos/{repo}/issues/*/comments", "api POST /repos/{repo}/pulls/*/comments",
  "api POST /repos/{repo}/pulls/*/comments/*/replies", "api PATCH /repos/{repo}/issues/comments/*",
  "graphql mutation addComment", "graphql mutation addPullRequestReviewComment",
  "graphql mutation addPullRequestReviewThreadReply", "graphql mutation resolveReviewThread",
]
github = ["push branch", "push force"]
rad = ["push branch", "push patch", "push force"]
git-sign = ["commit", "tag"]

[roles.maintainer]
description = "dev + merge and review PRs, manage issues and CI runs, fork and create repositories, tags"
extends = ["dev"]
gh = [
  "pr merge", "pr review", "pr close", "pr reopen", "pr update-branch",
  "issue edit", "issue close", "issue reopen", "label create", "label edit",
  "run rerun", "run cancel", "workflow run",
  "repo fork", "repo create",
  "graphql mutation mergePullRequest", "graphql mutation addPullRequestReview",
  "graphql mutation submitPullRequestReview",
]
github = ["push delete", "push tag"]
rad = ["push delete", "push tag"]

[roles.pm]
description = "Project boards: read, move and add items, add fields; edit, create and comment on issues"
extends = ["reader"]
gh = [
  "project list", "project view", "project item-list", "project field-list",
  "project item-add", "project item-edit", "project item-archive", "project item-create",
  "project field-create", "project mark-template", "project copy", "project link",
  "issue create", "issue edit", "issue comment", "issue close", "issue reopen",
  "issue edit --add-project", "issue edit --remove-project",
  "label create",
  "graphql query organization", "graphql query user", "graphql query repositoryOwner",
  "graphql mutation addProjectV2ItemById", "graphql mutation updateProjectV2ItemFieldValue",
  "graphql mutation updateProjectV2ItemPosition", "graphql mutation clearProjectV2ItemFieldValue",
  "graphql mutation archiveProjectV2Item", "graphql mutation createProjectV2Field",
  "graphql mutation updateProjectV2Field", "graphql mutation addProjectV2DraftIssue",
  "graphql mutation updateIssue", "graphql mutation addLabelsToLabelable",
  "graphql mutation removeLabelsFromLabelable", "graphql mutation addComment",
]

[roles.ops]
description = "ssh to the hosts in scope, sign commits; nothing on GitHub or Radicle beyond fetching"
github = ["fetch", "fetch public"]
rad = ["fetch"]
git-sign = ["commit", "tag"]
ssh = ["connect", "login"]
